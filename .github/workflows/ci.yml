name: BTC AI Trader CI

on:
  push:
    branches: [main, v1.17-long-historical-memory]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app run.py tests

      - name: Check JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/structure.js
          node --check app/static/patterns.js
          node --check app/static/learning.js
          node --check app/static/backtest.js
          node --check app/static/v18.js
          node --check app/static/v19.js
          node --check app/static/v20.js
          node --check app/static/v21.js
          node --check app/static/v22.js
          node --check app/static/v23.js
          node --check app/static/v24.js
          node --check app/static/v25.js
          node --check app/static/v26.js
          node --check app/static/v27.js

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Start app and verify health
        shell: bash
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/btc-ai.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/btc-ai.log
          exit 1
